<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a3d2e">
  <title>NOVIQ Admin</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0a3d2e; }
    #noviq-admin-status {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      box-sizing: border-box; color: #fff; font-family: system-ui, -apple-system,
      BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; text-align: center;
    }
    #noviq-admin-status .box { max-width: 520px; padding: 28px; border: 1px solid rgba(255,255,255,.16);
      border-radius: 16px; background: rgba(0,0,0,.16); }
    #noviq-admin-status h1 { margin: 0 0 10px; font-size: 24px; }
    #noviq-admin-status p { margin: 8px 0; line-height: 1.5; opacity: .86; }
    #noviq-admin-status .error { color: #ffd6d6; }
  </style>
  <!-- Netlify Identity is used by Decap CMS when the site uses Git Gateway. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <div id="noviq-admin-status">
    <div class="box">
      <h1>NOVIQ Admin</h1>
      <p>Loading content management system…</p>
      <p id="noviq-admin-error" class="error" hidden></p>
    </div>
  </div>

  <!-- Pin the stable Decap CMS release instead of relying on a floating CDN version. -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.15.1/dist/decap-cms.js"
          onload="window.__noviqDecapLoaded = true"
          onerror="window.__noviqDecapFailed = true; window.__noviqShowAdminError()"></script>

  <script>
    (function () {
      var status = document.getElementById('noviq-admin-status');
      var error = document.getElementById('noviq-admin-error');

      window.__noviqShowAdminError = function () {
        if (!error) return;
        error.hidden = false;
        error.textContent = 'The admin application could not be loaded. Check your internet connection and confirm that the site allows cdn.jsdelivr.net, then reload /admin/. ';
      };

      // Decap CMS takes over the page automatically after its script loads.
      // Do not force a redirect to login here; Decap handles authentication.
      setTimeout(function () {
        if (!window.__noviqDecapLoaded && !window.CMS) {
          window.__noviqShowAdminError();
        }
      }, 10000);
    })();
  </script>
</body>
</html>
